<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestmap User Types Board</title>
<style>
  :root { --fg:#14161a; --muted:#6b7280; --line:#e5e7eb; --accent:#0f766e; --soft:#f6f7f9; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --shadow:0 6px 24px rgba(0,0,0,.14); }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: #e9ecef; padding: 32px 24px 64px; }
  h1 { font-size: 26px; letter-spacing: -.01em; } .sub { color: var(--muted); margin: 4px 0 24px; }
  h2 { font-size: 20px; margin: 44px 0 4px; display: flex; align-items: center; gap: 10px; } .role { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; background: var(--accent); }
  .desc { color: var(--muted); margin-bottom: 16px; max-width: 760px; }
  .row8 { display: flex; flex-wrap: wrap; gap: 28px; }
  .cap { text-align: center; margin-bottom: 8px; font-weight: 700; } .cap small { display: block; font-weight: 400; color: var(--muted); }

  .phone { width: 316px; height: 640px; border: 8px solid #14161a; border-radius: 40px; overflow: hidden; position: relative; background: #fff; flex: none; }
  .phone > * { position: absolute; } .fill { inset: 0; } .scroll { left: 0; right: 0; top: 44px; bottom: 64px; overflow: hidden; padding: 6px 16px; }
  .status { top: 0; left: 0; right: 0; height: 34px; display: flex; justify-content: space-between; padding: 12px 22px 0; font-size: 11px; font-weight: 700; }
  .map { inset: 0; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='316' height='640'><rect width='316' height='640' fill='%23f1ece0'/><path d='M0 0h110c-20 120 30 200 10 320s-40 220-20 320H0z' fill='%23bcd9f2'/><g fill='none' stroke='%23fff' stroke-width='7'><path d='M130 0c20 140 90 200 70 330s-10 200 60 310'/><path d='M100 220h216'/></g></svg>") center/cover; }
  .dim { inset: 0; background: rgba(0,0,0,.4); }
  .search { left: 12px; right: 12px; top: 44px; height: 46px; background: #fff; border-radius: 999px; box-shadow: var(--shadow); display: flex; align-items: center; padding: 0 16px; color: var(--muted); }
  .tabbar { left: 12px; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 6px 24px rgba(15,23,42,.14); display: flex; align-items: center; padding: 5px 6px; font-size: 10px; color: var(--muted); }
  .tabbar div { flex: 1; text-align: center; padding: 4px 0; font-weight: 600; } .tabbar div.on { color: var(--accent); } .tabbar i { display: block; font-style: normal; font-size: 18px; line-height: 22px; }
  .tabbar div.fab { flex: 0 0 46px; height: 46px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; padding: 0; box-shadow: 0 4px 12px rgba(13,148,136,.45); } .tabbar div.fab i { font-size: 22px; line-height: 1; }
  .lm { width: 98px; background: rgba(255,255,255,.88); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 4px; box-shadow: 0 6px 24px rgba(15,23,42,.14); font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .lm div { padding: 8px 12px; border-radius: 18px; line-height: 1.2; } .lm div.on { background: var(--accent); color: #fff; box-shadow: 0 3px 10px rgba(13,148,136,.4); } .lm small { display: block; font-size: 10px; font-weight: 500; opacity: .85; }
  .lmf { width: 150px; background: rgba(255,255,255,.92); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; padding: 5px; box-shadow: 0 6px 24px rgba(15,23,42,.14); font-size: 12.5px; font-weight: 600; }
  .lmf div { padding: 8px 10px; border-radius: 12px; } .lmf div.on { color: var(--accent); background: #e6f4f2; } .lmf div.all { color: var(--muted); }
  .pin { position: relative; background: #fff; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; box-shadow: 0 1px 2px rgba(15,23,42,.16), 0 4px 12px rgba(15,23,42,.12); border: 1px solid rgba(15,23,42,.07); white-space: nowrap; }
  .pin::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 7px; height: 7px; background: inherit; border-right: 1px solid rgba(15,23,42,.07); border-bottom: 1px solid rgba(15,23,42,.07); transform: translateX(-50%) rotate(45deg); }
  .nav { left: 0; right: 0; bottom: 0; height: 64px; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 8px; font-size: 10px; color: var(--muted); }
  .nav div { text-align: center; } .nav div.on { color: var(--accent); font-weight: 700; } .nav i { display: block; font-style: normal; font-size: 18px; line-height: 22px; }
  .sheet { left: 0; right: 0; bottom: 0; background: #fff; border-radius: 22px 22px 0 0; padding: 8px 18px 22px; box-shadow: var(--shadow); }
  .grab { width: 38px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 14px; }
  .title { font-size: 19px; font-weight: 800; letter-spacing: -.01em; } .muted { color: var(--muted); } .small { font-size: 12px; }
  .btn { padding: 12px; border-radius: 12px; font-weight: 700; text-align: center; font-size: 13px; display: block; } .btn.p { background: var(--accent); color: #fff; } .btn.g { border: 1px solid var(--line); } .btn.d { background: #14161a; color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; } .sp { justify-content: space-between; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 10px; background: #fff; }
  .ph { background: #cbd5e1 center/cover; border-radius: 10px; flex: none; }
  .st { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; display: inline-block; } .st.ok { background: #dcfce7; color: var(--ok); } .st.wr { background: #fef3c7; color: var(--warn); } .st.bd { background: #fee2e2; color: var(--bad); } .st.gr { background: #e5e7eb; color: #374151; } .st.bl { background: #dbeafe; color: #1d4ed8; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12px; display: inline-block; } .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .field { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 10px; } .field small { display: block; color: var(--muted); font-size: 11px; }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 10px; } .stats div { background: var(--soft); border-radius: 12px; padding: 10px 6px; text-align: center; font-size: 11px; color: var(--muted); } .stats b { display: block; font-size: 18px; color: var(--fg); }
  .bars { display: flex; align-items: flex-end; gap: 5px; height: 70px; margin-top: 8px; } .bars i { flex: 1; background: #99d5cd; border-radius: 3px 3px 0 0; } .bars i.hi { background: var(--accent); }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
  .otp { display: flex; gap: 8px; margin-top: 14px; } .otp i { flex: 1; height: 46px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 18px; }
  .lock { position: absolute; right: 12px; font-size: 14px; }
  .bub { max-width: 78%; padding: 8px 12px; border-radius: 14px; margin-top: 8px; font-size: 13px; background: var(--soft); } .bub.me { margin-left: auto; background: var(--accent); color: #fff; }
  .step { display: flex; gap: 4px; margin: 8px 0 14px; } .step i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); } .step i.on { background: var(--accent); }
  .tog { width: 36px; height: 20px; border-radius: 999px; background: var(--accent); position: relative; display: inline-block; } .tog::after { content:""; position:absolute; right:2px; top:2px; width:16px; height:16px; background:#fff; border-radius:50%; }

  /* matrix */
  .tbl { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; max-width: 1040px; } table { width: 100%; border-collapse: collapse; }
  th { text-align: center; font-size: 12px; padding: 10px 8px; background: var(--soft); border-bottom: 1px solid var(--line); } th:first-child, td:first-child { text-align: left; padding-left: 14px; }
  td { text-align: center; padding: 8px; border-bottom: 1px solid var(--line); } tr:last-child td { border: 0; } td.y { color: var(--ok); font-weight: 700; } td.n { color: #cbd5e1; } td.l { color: var(--warn); font-size: 12px; }

  /* admin role windows */
  .win { width: 1000px; max-width: 100%; height: 400px; border-radius: 12px; border: 1px solid #cfd4da; background: #fff; overflow: hidden; display: flex; box-shadow: 0 10px 30px rgba(0,0,0,.08); font-size: 13px; }
  .side { width: 190px; background: #14161a; color: #cbd5e1; padding: 14px 10px; flex: none; } .side .logo { color: #fff; font-weight: 800; padding: 2px 10px 12px; }
  .side a { padding: 7px 10px; border-radius: 8px; display: flex; justify-content: space-between; } .side a.on { background: #24282f; color: #fff; } .side a.off { color: #4b5563; }
  .main { flex: 1; background: var(--soft); padding: 16px 18px; } .main h3 { margin-bottom: 10px; }
  .bnr { background: #fef3c7; color: #92400e; border-radius: 8px; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; }
  .t2 { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; } .t2 table td, .t2 table th { text-align: left; padding: 8px 12px; } .t2 th { background: #fff; color: var(--muted); font-weight: 600; font-size: 11px; }
  .radio { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); } .radio i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #cbd5e1; flex: none; } .radio.on i { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, #fff 50%); }
  .big-ico { width: 96px; height: 96px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 40px; margin: 0 auto 14px; } .c { text-align: center; } .btn.r { border: 1px solid #fecaca; color: var(--bad); }

  .day { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; } .day div { border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; text-align: center; font-size: 11px; color: var(--muted); } .day b { display: block; font-size: 16px; color: var(--fg); } .day .on { background: var(--accent); color: #fff; border-color: var(--accent); } .day .on b { color: #fff; }
  .slots { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 8px; } .slots div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; text-align: center; font-size: 12px; } .slots .on { border-color: var(--accent); background: #e3f2f0; color: var(--accent); font-weight: 700; }
  .nb { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12px; }
  .browser { width: 1040px; max-width: 100%; border-radius: 12px; border: 1px solid #cfd4da; background: #fff; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.08); flex: none; }
  .url { background: #eef0f3; padding: 8px 14px; display: flex; gap: 8px; align-items: center; } .url i { width: 10px; height: 10px; border-radius: 50%; background: #cbd0d6; } .url span { flex: 1; background: #fff; border-radius: 6px; padding: 3px 12px; color: var(--muted); font-size: 12px; }
  .dtop { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); } .dtop b { font-size: 17px; font-weight: 800; } .dtop b i { color: var(--accent); font-style: normal; }
  .d2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; margin-top: 12px; }
  .dtbl { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; } .dtbl table { width: 100%; border-collapse: collapse; } .dtbl th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); } .dtbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); } .dtbl tr:last-child td { border: 0; }
  .kan { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 12px; } .kan .col { background: var(--soft); border-radius: 12px; padding: 10px; min-height: 330px; }
  .tablet { width: 860px; height: 560px; border: 10px solid #14161a; border-radius: 28px; overflow: hidden; position: relative; background: #fff; display: flex; flex: none; }
  .rail { width: 64px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 18px; font-size: 10px; color: var(--muted); flex: none; } .rail div { text-align: center; } .rail i { display: block; font-style: normal; font-size: 20px; } .rail .on { color: var(--accent); font-weight: 700; }
  .pane { width: 300px; border-right: 1px solid var(--line); padding: 14px; overflow: hidden; flex: none; }
  .wk { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin-top: 12px; } .wd { border: 1px solid var(--line); border-radius: 10px; min-height: 380px; padding: 6px; font-size: 11px; } .wd b { display: block; margin-bottom: 6px; } .ev { background: #e3f2f0; color: var(--accent); border-radius: 6px; padding: 4px 6px; margin-bottom: 4px; font-weight: 600; } .ev.w { background: #fef3c7; color: var(--warn); }
</style>
</head>
<body>
<h1>Nestmap — user types board</h1>
<p class="sub">Screens for every role. Same visual style as the main app. Each section shows what that role sees that others don't.</p>

<h2>Who can do what</h2>
<div class="tbl" id="matrix"></div>

<div id="out"></div>

<script>
/* ---------- helpers ---------- */
const img = n => `background-image:url(https://picsum.photos/seed/${n}/200/150)`;
const status = `<div class="status"><span>9:41</span><span>●●● 5G</span></div>`;
const NAVS = {
  guest: [["◉","Map",1],["♡","Saved"],["＋","Post"],["◔","Log in"]],
  buyer: [["◉","Map",1],["♡","Saved"],["✉","Inbox"],["◔","Profile"]],
  owner: [["◉","Map",1],["♡","Saved"],["▤","My homes"],["◔","Profile"]],
  agent: [["◉","Map",1],["◔","Leads"],["▤","Listings"],["◔","Profile"]],
};
const nav = (role, active) => `<div class="tabbar">${NAVS[role].map(([i, t]) => `<div class="${t === active ? "on" : ""}"><i>${i}</i>${t}</div>`).join("")}</div>`;
const phone = (t, s, inner) => `<div><div class="cap">${t}<small>${s}</small></div><div class="phone">${inner}</div></div>`;
const page = (role, active, body) => `<div class="fill" style="background:#fff"></div>${status}<div class="scroll">${body}</div>${nav(role, active)}`;
const bars = (a, hi) => `<div class="bars">${a.map((h, i) => `<i class="${i === hi ? "hi" : ""}" style="height:${h}%"></i>`).join("")}</div>`;
const section = (name, role, desc, items) => `<h2>${name}<span class="role">${role}</span></h2><div class="desc">${desc}</div><div class="row8">${items.join("")}</div>`;
const mapBase = `<div class="map"></div>${status}`;

/* ---------- matrix ---------- */
const M = [["Browse map, search, view details","y","y","y","y","y"],["Save homes and searches","l","y","y","y","–"],["Message agents / owners","l","y","y","y","–"],["Post a listing","l","n","y","y","–"],["Listings limit","–","–","3 free","Unlimited","–"],["Verified badge","–","–","n","y","–"],["Lead inbox and ratings","–","–","n","y","–"],["Boost a listing","–","–","paid","paid","–"],["Review / approve listings","–","–","–","–","Admin"],["Manage users and reports","–","–","–","–","Admin"]];
document.getElementById("matrix").innerHTML = `<table><tr><th>Capability</th><th>Guest</th><th>Buyer</th><th>Owner</th><th>Agent</th><th>Admin team</th></tr>` +
  M.map(r => `<tr>${r.map((c, i) => i === 0 ? `<td>${c}</td>` : `<td class="${c === "y" ? "y" : c === "n" ? "n" : "l"}">${c === "y" ? "✓" : c === "n" ? "✕" : c === "l" ? "Log in first" : c}</td>`).join("")}</tr>`).join("") + `</table>`;

const out = [];

/* ---------- GUEST ---------- */
out.push(section("Guest", "Not logged in", "Can explore everything on the map. Save, message and post actions open a quick phone-number login instead of a hard wall.", [
  phone("Browse as guest", "Full map access, no signup", `${mapBase}<div class="search">🔍&nbsp;Search area or city</div>
    <div class="pin" style="left:90px;top:230px">₹1.2 Cr</div><div class="pin" style="left:200px;top:300px">₹85 L</div><div class="pin" style="left:120px;top:380px">₹1.6 Cr</div>
    <div class="sheet" style="bottom:64px"><div class="grab"></div><div class="row"><div class="ph" style="width:72px;height:56px;${img("g1")}"></div><div><b>₹1.6 Cr</b><div class="muted small">3 bed · 24 Beach Rd</div></div><span style="margin-left:auto">♡</span></div></div>${nav("guest", "Map")}`),
  phone("Login prompt", "Appears when a guest taps ♡ or Message", `${mapBase}<div class="dim"></div>
    <div class="sheet"><div class="grab"></div><div class="title">Log in to save this home</div><div class="muted small" style="margin:4px 0 14px">Keep a shortlist and get price-drop alerts.</div>
    <div class="field"><small>Phone number</small>+91 | 98•••• 1234</div><div class="btn p" style="margin-top:14px">Send OTP</div><div class="muted small" style="text-align:center;margin-top:12px">Continue browsing</div></div>`),
  phone("OTP verify", "Same screen for signup and login", `<div class="fill" style="background:#fff"></div>${status}<div style="left:20px;right:20px;top:90px"><div class="title">Enter the code</div><div class="muted small">Sent to +91 98•••• 1234</div>
    <div class="otp"><i>4</i><i>8</i><i>2</i><i>9</i><i></i><i></i></div><div class="btn p" style="margin-top:20px">Verify</div><div class="muted small" style="text-align:center;margin-top:12px">Resend in 0:24</div></div>`),
]));

/* ---------- BUYER ---------- */
out.push(section("Buyer / renter", "Logged in", "Everything a guest has, plus a shortlist, saved searches with alerts, and an inbox for conversations with agents and owners.", [
  phone("Saved searches & alerts", "Get notified when new homes match", page("buyer", "Profile", `<div class="title" style="margin:6px 0 4px">Saved searches</div>
    ${[["2+ bed · Buy · under ₹1.2 Cr","Kozhikode","3 new"],["Rent · under ₹25k","Palayam","1 new"]].map(s => `<div class="card"><div class="row sp"><b>${s[0]}</b><span class="st ok">${s[2]}</span></div><div class="muted small">${s[1]}</div><div class="row sp" style="margin-top:8px"><span class="small">Price alerts</span><span class="tog"></span></div></div>`).join("")}
    <div class="btn g" style="margin-top:12px">+ Save current search</div>`)),
  phone("Inbox", "Conversations with agents / owners", page("buyer", "Inbox", `<div class="title" style="margin:6px 0 4px">Inbox</div>
    ${[["Anil Kumar","24 Beach Rd","Yes, available. Saturday 11am?","5m","1"],["Fathima R.","12 Lake View St","Parking for 2 cars.","2h",""],["Owner · Joseph","3 Canal Rd","Thanks for your interest!","1d",""]].map(c => `<div class="row" style="padding:12px 0;border-top:1px solid var(--line)"><div class="av">${c[0][0]}</div><div style="flex:1;min-width:0"><div class="row sp"><b>${c[0]}</b><span class="muted small">${c[3]}</span></div><div class="muted small">${c[1]}</div><div class="small">${c[2]}</div></div>${c[4] ? '<span class="st bl">1</span>' : ""}</div>`).join("")}`)),
  phone("Chat", "One thread per home", `<div class="fill" style="background:#fff"></div>${status}
    <div style="left:0;right:0;top:34px;padding:10px 16px;border-bottom:1px solid var(--line)" class="row"><span>‹</span><div class="av" style="width:34px;height:34px">A</div><div><b>Anil Kumar</b><div class="muted small">24 Beach Rd · ₹1.6 Cr</div></div></div>
    <div style="left:16px;right:16px;top:100px"><div class="bub me">Is this still available?</div><div class="bub">Yes! Would you like to visit Saturday 11am?</div><div class="bub me">Works for me 👍</div><div class="bub">Great, I'll share the exact location.</div></div>
    <div style="left:12px;right:12px;bottom:14px" class="row"><div class="field" style="flex:1;margin:0;border-radius:999px">Type a message…</div><div class="av" style="width:42px;height:42px">➤</div></div>`),
]));

var fx = body => `<div class="fill" style="background:#fff"></div>${status}${body}`;
out.push(section("Buyer · visits, reviews & chat", "Buyer", "After a visit is booked, buyers can track it, change it, rate the agent and use richer chat.", [
